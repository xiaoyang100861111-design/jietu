name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 依赖都钉死版本，免得上游一动这边就编不过
  LING_REF: b77448ec7e72b1b961d3c6f8f87502d8df72aa5f

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Ling
        uses: actions/checkout@v4
        with:
          repository: xland/Ling
          ref: ${{ env.LING_REF }}
          path: deps/Ling

      - name: Checkout gifski
        shell: pwsh
        run: git clone --depth 1 https://github.com/ImageOptim/gifski.git deps/gifski

      - name: Cache gifski build
        uses: actions/cache@v4
        with:
          path: |
            deps/gifski/target
            ~/.cargo/registry
          key: gifski-${{ runner.os }}-v1

      - name: Build gifski
        shell: pwsh
        working-directory: deps/gifski
        env:
          # 主工程是 /MT，Rust 这边也得静态链 CRT
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --lib

      # 版本号 = 编译时间（北京时间）。写进 BuildInfo.h 编进 exe，后面发布 version.json 时用的也是它
      - name: Stamp version
        shell: pwsh
        run: |
          $now = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'China Standard Time')
          $ver = $now.ToString('yyyy.MM.dd.HHmm')
          "BUILD_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content -Path Src\BuildInfo.h -Encoding utf8 -Value "#pragma once`n#define BUILD_VERSION L`"$ver`"`n"
          Get-Content Src\BuildInfo.h

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
          $toolset = if ($vs.StartsWith('18.')) { 'v145' } else { 'v143' }
          Write-Host "Visual Studio $vs, toolset $toolset"
          $root = (Get-Location).Path
          $ling = "$root\deps\Ling"
          $common = @('/m', '/nologo', '/v:minimal', '/p:Configuration=Release', '/p:Platform=x64', "/p:PlatformToolset=$toolset")
          "Visual Studio $vs, toolset $toolset" | Out-File build.log -Encoding utf8
          function Build {
            msbuild @args @common 2>&1 | Tee-Object -FilePath build.log -Append
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Build "$ling\yoga\yoga.vcxproj" "/p:SolutionDir=$ling\"
          Build "$ling\Ling.vcxproj" "/p:SolutionDir=$ling\"
          Get-ChildItem "$ling\x64\Release" -Filter *.lib | Select-Object Name, Length
          Build "$root\Src\ScreenCapture.vcxproj" "/p:SolutionDir=$root\" "/p:LingDir=$ling" "/p:GifskiDir=$root\deps\gifski"
          Get-ChildItem "$root\x64\Release" -Filter *.exe | Select-Object Name, Length

      # 编译日志要登录才能下载，这里额外挂到一个固定的 release 上，方便不登录也能看
      - name: Publish build log
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (!(Test-Path build.log)) { exit 0 }
          Select-String -Path build.log -Pattern 'error [A-Z]+\d+|fatal error' | Select-Object -First 60 | ForEach-Object { $_.Line } | Out-File build-errors.txt -Encoding utf8
          gh release view ci-log 2>$null
          if ($LASTEXITCODE) { gh release create ci-log --prerelease --title 'CI build log' --notes 'latest build log' }
          gh release upload ci-log build.log build-errors.txt --clobber
          exit 0

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process "x64\Release\ScreenCapture.exe" -ArgumentList '--enter=tray' -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "ScreenCapture.exe exited early, code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'started and stayed alive'

      # 发布出去的文件叫 UUjietu.exe（编译产物本身仍是 ScreenCapture.exe）。
      # 不能用中文名：GitHub 会把发布附件名里的非 ASCII 字符去掉，"UU截图.exe" 传上去就成了 "UU.exe"
      - name: Rename
        shell: pwsh
        run: |
          Copy-Item "x64\Release\ScreenCapture.exe" "x64\Release\UUjietu.exe"
          # map 文件：崩溃日志里记的是"模块+偏移"，靠它查是哪个函数
          if (Test-Path "x64\Release\ScreenCapture.map") { Copy-Item "x64\Release\ScreenCapture.map" "x64\Release\UUjietu.map" } else { Write-Host "no map file"; Get-ChildItem x64\Release | Select-Object Name }

      - uses: actions/upload-artifact@v4
        with:
          name: UUjietu
          path: x64/Release/UUjietu.exe

      # GitHub 会把发布附件名里的中文去掉，所以另外把 exe 以中文名放到 dist 分支上：
      # https://github.com/<仓库>/raw/dist/UU截图.exe 下载下来文件名就是中文的，而且永远是最新一版。
      # 分支每次强推成只有一个提交，不让仓库越来越大
      - name: Publish to dist branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "x64\Release\ScreenCapture.exe" (Join-Path $dir 'UU截图.exe')
          # version.json：程序启动时来这里看有没有新版本。notes 是这一版的更新说明（Doc/update-notes.txt）
          $notes = (Get-Content Doc\update-notes.txt -Raw -Encoding utf8).Trim()
          $info = [ordered]@{
            version = $env:BUILD_VERSION
            notes = $notes
            url = "https://raw.githubusercontent.com/${{ github.repository }}/dist/UU%E6%88%AA%E5%9B%BE.exe"
          }
          $info | ConvertTo-Json | Set-Content -Path (Join-Path $dir 'version.json') -Encoding utf8
          Set-Location $dir
          git init -q -b dist
          git config user.name 'github-actions'
          git config user.email 'actions@users.noreply.github.com'
          git config core.quotepath false
          git add -A
          git commit -q -m "build ${{ github.run_number }} ($env:BUILD_VERSION)"
          git push -f "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.git" dist
          if ($LASTEXITCODE) { Write-Host 'push to dist failed'; exit 0 }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: UU截图 ${{ env.BUILD_VERSION }} (build ${{ github.run_number }})
          body_path: Doc/update-notes.txt
          files: |
            x64/Release/UUjietu.exe
            x64/Release/UUjietu.map
